<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<title>Our World Cup 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(12px,1.1vw,16px)}
html,body{width:100%;height:100%;overflow:hidden;background:#021033;font-family:'Nunito',sans-serif;color:#fff}
#app{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;transition:opacity .3s,transform .3s}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.97)}

/* ── HOME ── */
#home{background:linear-gradient(160deg,#021033 0%,#001a08 50%,#1a1200 100%)}
.home-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:clamp(10px,2vh,18px) 14px 70px;gap:clamp(8px,1.5vh,14px)}

.cover-wrap{
  width:min(260px,55vw,38vh);
  aspect-ratio:3/4;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  box-shadow:0 12px 50px rgba(0,0,0,.7),0 0 40px rgba(255,215,0,.15);
  flex-shrink:0;
}
.cover-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:420px}
.stat-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 5px;text-align:center}
.stat-val{font-family:'Bebas Neue',cursive;font-size:1.35rem;color:#FFDF00;line-height:1}
.stat-label{font-size:.54rem;color:rgba(255,255,255,.4);font-weight:700;letter-spacing:1.5px;margin-top:2px}

.pack-area{width:100%;max-width:420px;background:rgba(255,255,255,.04);border:1px solid rgba(255,215,0,.1);border-radius:16px;padding:16px;text-align:center}
.pack-vis-wrap{width:72px;height:101px;margin:0 auto 10px;position:relative}
.pack-vis{width:100%;height:100%;border-radius:10px;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
.pack-vis img{width:100%;height:100%;object-fit:cover;display:block}
.pack-vis.ready{box-shadow:0 6px 28px rgba(0,156,59,.6);animation:pp 2s ease-in-out infinite}
.pack-badge{width:20px;height:20px;border-radius:50%;background:#FF3B30;color:#fff;font-size:.6rem;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #021033;position:absolute;top:-7px;right:-7px;z-index:10}
@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pack-ready-lbl{font-family:'Bebas Neue',cursive;font-size:1rem;letter-spacing:2px;color:#FFDF00;margin-bottom:4px}
.timer-lbl{font-size:.58rem;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.35);margin-bottom:4px}
.timer-disp{font-family:'Bebas Neue',cursive;font-size:1.9rem;letter-spacing:4px;line-height:1}
.prog-wrap{width:100%;height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin:8px 0;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,#009c3b,#FFDF00);border-radius:2px;transition:width .5s}

.btn{cursor:pointer;border:none;outline:none;font-family:'Nunito',sans-serif;font-weight:900;border-radius:10px;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:active{transform:scale(.95)}
.btn-gold{background:linear-gradient(135deg,#FFDF00,#FF9500);color:#000;padding:11px 20px;font-size:.86rem;box-shadow:0 4px 18px rgba(255,215,0,.28)}
.btn-gold:disabled{background:linear-gradient(135deg,#2a2a2a,#1a1a1a);color:rgba(255,255,255,.2);box-shadow:none;cursor:not-allowed;transform:none}
.btn-ghost{background:rgba(255,255,255,.07);color:#fff;padding:9px 14px;font-size:.76rem;border:1px solid rgba(255,255,255,.1)}
.btn-green{background:linear-gradient(135deg,#009c3b,#006d2a);color:#fff;padding:11px 20px;font-size:.86rem;box-shadow:0 4px 16px rgba(0,156,59,.25)}

/* ── OPENING ── */
#opening{background:radial-gradient(ellipse at center,#001a08 0%,#021033 70%);align-items:center;justify-content:center}
.open-inner{display:flex;flex-direction:column;align-items:center;width:100%;padding:18px;gap:12px}
.pack-env{width:min(130px,32vw);height:min(182px,45vw);border-radius:12px;cursor:pointer;position:relative;overflow:hidden;transition:opacity .5s,transform .5s;animation:pf 3s ease-in-out infinite;user-select:none;box-shadow:0 10px 40px rgba(0,156,59,.45)}
.pack-env img{width:100%;height:100%;object-fit:cover;display:block}
.pack-env-tap{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-family:'Bebas Neue',cursive;font-size:.7rem;letter-spacing:2px;color:rgba(255,255,255,.9);background:rgba(0,0,0,.5);padding:3px 10px;border-radius:6px;white-space:nowrap}
.pack-env.opening{transform:scale(1.1) rotate(3deg)!important;opacity:0;animation:none!important}
@keyframes pf{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.open-prog{display:flex;justify-content:center;gap:6px}
.open-prog-dot{height:4px;width:36px;border-radius:2px;transition:all .3s}
.open-lbl{font-family:'Bebas Neue',cursive;font-size:.76rem;letter-spacing:3px;color:rgba(255,255,255,.35)}
.stickers-reveal{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:min(360px,90vw)}
.sr-wrap{animation:siu .5s both ease-out}
@keyframes siu{from{opacity:0;transform:translateY(24px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
.sc{width:min(74px,17vw);height:min(104px,24vw);border-radius:8px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.sc.flipped{transform:rotateY(180deg)}
.sc-f,.sc-b{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden}
.sc-f{background:linear-gradient(135deg,#001a3a,#0a0820);border:2px solid rgba(255,215,0,.2);display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:rgba(255,255,255,.07)}
.sc-b{transform:rotateY(180deg);overflow:hidden;border-width:2px;border-style:solid;display:flex;flex-direction:column}
.sc-img{flex:1;overflow:hidden;background:#0a0820}
.sc-img img{width:100%;height:100%;object-fit:cover;display:block}
.sc-footer{padding:3px 4px;text-align:center;flex-shrink:0}
.sc-name{font-size:.38rem;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── ALBUM ── */
#album{
  background:
    linear-gradient(rgba(1,13,31,.92),rgba(1,13,31,.96)),
    url('image/Capa do Álbum.png') center/cover no-repeat fixed;
}
.alb-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(0,0,0,.6);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px);flex-shrink:0;z-index:20}
.alb-title-txt{font-family:'Bebas Neue',cursive;font-size:.95rem;letter-spacing:4px;color:#FFDF00}

.alb-body{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(8px,2vw,20px);
  overflow:hidden;
  position:relative;
}

/* ── LIVRO ── */
.album-page{
  width:min(96vw,520px);
  height:min(calc(100dvh - 180px),700px);
  background:
    linear-gradient(rgba(1,13,31,.84),rgba(1,13,31,.90)),
    url('image/Capa do Álbum.png') center/cover no-repeat;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    -6px 0 20px rgba(0,0,0,.5),
    6px 0 20px rgba(0,0,0,.3),
    0 20px 60px rgba(0,0,0,.5),
    0 0 40px rgba(255,215,0,.06),
    inset 4px 0 12px rgba(0,0,0,.4);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  animation:pageIn .35s ease-out both;
}
@keyframes pageIn{from{opacity:0;transform:translateX(30px) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}
.album-page::before{
  content:'';position:absolute;top:0;left:0;width:18px;height:100%;
  background:linear-gradient(to right,rgba(0,0,0,.55),transparent);
  pointer-events:none;z-index:3;
}
.album-page::after{
  content:'';position:absolute;top:0;right:0;width:60px;height:100%;
  background:linear-gradient(to left,rgba(255,255,255,.04),transparent);
  pointer-events:none;
}

/* spine effect */
.book-spine{
  position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(to right,rgba(0,0,0,.7),rgba(255,215,0,.08),rgba(0,0,0,.3));
  z-index:4;border-radius:18px 0 0 18px;
}

.page-hdr{
  padding:clamp(10px,2vw,18px) clamp(12px,3vw,24px) clamp(6px,1.2vw,10px);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.page-hdr-title{font-family:'Bebas Neue',cursive;font-size:clamp(.78rem,1.8vw,1.05rem);letter-spacing:3px}

/* ── GRID 3 COLUNAS LAYOUT ── */
.sticker-grid{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:clamp(6px,1.5vw,16px);
  padding:clamp(10px,2vw,22px);
  min-height:0;
  align-items:center;
  justify-items:center;
}
.slot:nth-child(1){grid-column:1;grid-row:1}
.slot:nth-child(2){grid-column:1;grid-row:2}
.slot:nth-child(3){grid-column:2;grid-row:1/3;align-self:center;justify-self:center}
.slot:nth-child(4){grid-column:3;grid-row:1}
.slot:nth-child(5){grid-column:3;grid-row:2}

/* todos os slots: tamanho fixo baseado na altura disponível */
.slot{
  width:min(100%,120px);
  aspect-ratio:5/7;
  max-height:min(45%,160px);
  height:auto;
}
/* slot central: mesmo tamanho, só centralizado */
.slot:nth-child(3){
  width:min(100%,120px);
  max-height:min(45%,160px);
}

/* MODAL */
.sticker-modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:999;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sticker-modal{
  width:min(260px,70vw);
  aspect-ratio:5/7;
  border-radius:18px;overflow:hidden;position:relative;
  border:3px solid;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  animation:popIn .25s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.sticker-modal img{width:100%;height:100%;object-fit:cover;display:block}
.sticker-modal-num{
  position:absolute;top:10px;left:10px;
  background:rgba(0,0,0,.75);border-radius:8px;
  font-family:'Bebas Neue',cursive;font-size:1rem;
  padding:2px 10px;color:#fff;z-index:2;
}
.sticker-modal-close{
  position:absolute;top:10px;right:10px;
  width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:2;
}

.slot{
  aspect-ratio:5/7;
  border-radius:clamp(6px,1.2vw,12px);
  border:1.5px dashed rgba(255,255,255,.14);
  position:relative;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.2));
  transition:.22s;
  min-width:0;min-height:0;
}
.slot.placed{border-style:solid}
.slot-num{
  position:absolute;top:4px;left:4px;
  width:clamp(16px,3vw,22px);height:clamp(16px,3vw,22px);
  border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',cursive;
  font-size:clamp(.45rem,.9vw,.7rem);
  background:rgba(0,0,0,.75);
  z-index:5;color:#fff;
}
.slot img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.slot-empty-txt{font-family:'Bebas Neue',cursive;font-size:clamp(1.2rem,2.5vw,2rem);opacity:.07;color:#fff}

/* CAPA do álbum */
.alb-cover-inner{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:0;padding:0;overflow:hidden;
}
.alb-cover-img{
  width:100%;height:100%;
  border-radius:0;overflow:hidden;
  border:none;box-shadow:none;
}
.alb-cover-img img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#000}
.cover-progress{
  padding:8px 20px;border-radius:999px;
  background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.18);
  font-family:'Bebas Neue',cursive;font-size:.9rem;letter-spacing:3px;color:#FFDF00;
}

/* NAV */
.alb-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:rgba(0,0,0,.5);
  border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;
}
.page-dots{display:flex;gap:6px}
.pdot{height:7px;border-radius:999px;transition:.3s;cursor:pointer}
#nav-prev,#nav-next{width:clamp(36px,6vw,52px);height:clamp(36px,6vw,52px);padding:0;font-size:1.2rem;border-radius:12px}

/* TRAY */
.sticker-tray{
  flex-shrink:0;padding:8px 12px 12px;
  background:rgba(0,0,0,.75);backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.06);
}
.tray-label{font-family:'Bebas Neue',cursive;font-size:.75rem;letter-spacing:2px;margin-bottom:6px;color:rgba(255,255,255,.6)}
.tray-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.tray-scroll::-webkit-scrollbar{display:none}
.mini-s{
  width:clamp(44px,8vw,64px);height:clamp(62px,11.2vw,90px);
  border-radius:8px;overflow:hidden;position:relative;border:2px solid;
  flex-shrink:0;cursor:grab;background:#111;transition:.18s;
  box-shadow:0 4px 10px rgba(0,0,0,.4);touch-action:none;
}
.mini-s:active{cursor:grabbing;transform:scale(.95)}
.mini-s img{width:100%;height:100%;object-fit:cover;display:block}
.mini-num{
  position:absolute;top:3px;left:3px;min-width:16px;height:16px;padding:0 3px;
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',cursive;font-size:.5rem;color:#fff;z-index:2;background:rgba(0,0,0,.8);
}

/* DRAG GHOST */
#drag-ghost{
  position:fixed;pointer-events:none;z-index:9999;
  border-radius:8px;border:2px solid;display:none;
  width:50px;height:70px;overflow:hidden;background:#111;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#drag-ghost img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="home" class="screen">
<div class="home-scroll">
  <div class="cover-wrap">
    <img src="image/Capa do Álbum.png" alt="Capa"/>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="stat-col">0/25</div><div class="stat-label">COLETADAS</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-placed">0/25</div><div class="stat-label">COLADAS</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-packs">0/5</div><div class="stat-label">PACKS</div></div>
  </div>
  <div class="pack-area">
    <div class="pack-vis-wrap">
      <div class="pack-vis" id="pvis">
        <img src="image/CAPA DO PACK DAS FIGURINHAS.png" alt="Pack"/>
      </div>
      <div class="pack-badge" id="pbadge" style="display:none">0</div>
    </div>
    <div id="timer-sec">
      <div class="timer-lbl">PRÓXIMO PACK EM</div>
      <div class="timer-disp" id="timer">01:00:00</div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="prog" style="width:0%"></div></div>
    <button class="btn btn-gold" id="claim-btn" style="width:100%;margin-top:8px" disabled>AGUARDE O PACK</button>
  </div>
  <button class="btn btn-green" id="go-album" style="width:100%;max-width:420px">📖 VER ÁLBUM</button>
</div>
</div>

<!-- OPENING -->
<div id="opening" class="screen hidden">
<div class="open-inner">
  <div class="open-prog" id="open-prog"></div>
  <div class="open-lbl" id="open-lbl">PACK 1 DE 1</div>
  <div id="open-content" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%"></div>
</div>
</div>

<!-- ALBUM -->
<div id="album" class="screen hidden">
  <div class="alb-topbar">
    <button class="btn btn-ghost" id="alb-back" style="padding:7px 12px;font-size:.74rem">← VOLTAR</button>
    <div class="alb-title-txt" id="alb-title">CAPA</div>
    <div style="font-size:.66rem;color:rgba(255,255,255,.4);font-weight:700" id="alb-prog">0/25</div>
  </div>
  <div class="alb-body" id="alb-body"></div>
  <div class="alb-nav">
    <button class="btn btn-ghost" id="nav-prev" style="">‹</button>
    <div class="page-dots" id="page-dots"></div>
    <button class="btn btn-ghost" id="nav-next" style="">›</button>
  </div>
  <div class="sticker-tray" id="sticker-tray" style="display:none">
    <div class="tray-label">SUAS FIGURINHAS • ARRASTE PARA COLAR</div>
    <div class="tray-scroll" id="tray-scroll"></div>
  </div>
</div>

<div id="drag-ghost"><img id="ghost-img" src="" alt=""/></div>
</div>

const PAGES = [
  {label:'SESSÃO 1 • 1-5',    ids:[1,2,3,4,5],     border:'#009c3b'},
  {label:'SESSÃO 2 • 6-10',   ids:[6,7,8,9,10],    border:'#DAA520'},
  {label:'SESSÃO 3 • 11-15',  ids:[11,12,13,14,15],border:'#7B2D8B'},
  {label:'SESSÃO 4 • 16-20',  ids:[16,17,18,19,20],border:'#003087'},
  {label:'SESSÃO 5 • 21-25',  ids:[21,22,23,24,25],border:'#8B3A1A'},
];

const TOTAL_PACKS = 5;
const PACK_SIZE   = 5;
// 1 pack a cada 1h
const INTERVAL_MS = 60 * 60 * 1000;

// --- Estado ---
let state = {
  openedPacks: [],   // quantos packs já foram abertos (índice sequencial)
  collected:   [],   // IDs coletados (podem repetir — guardamos como set)
  placed:      {},   // {id: true}
  lastClaim:   null, // timestamp do último resgate
  pending:     1,    // packs disponíveis no momento
};
function save(){ try{ localStorage.setItem('owc26e', JSON.stringify(state)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem('owc26e'); if(r) state=JSON.parse(r); }catch(e){} }

function $(id){ return document.getElementById(id); }
function sById(id){ return STICKERS[id-1]; }
function fmt(ms){
  if(ms<=0) return '00:00:00';
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return [h,m,sec].map(v=>String(v).padStart(2,'0')).join(':');
}
function showScreen(n){ document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); $(n).classList.remove('hidden'); }

// Shuffle (Fisher-Yates)
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Gera 5 figurinhas aleatórias dentre as 25 para um pack
function randomPackIds(){
  const all = STICKERS.map(s=>s.id);
  return shuffle(all).slice(0, PACK_SIZE);
}

function getStatus(){
  const now = Date.now();
  const rem = TOTAL_PACKS - state.openedPacks.length;
  if(rem <= 0) return {pending:0, msLeft:0, progress:1};
  if(!state.lastClaim) return {pending: Math.max(state.pending,1), msLeft:INTERVAL_MS, progress:0};
  const el = now - state.lastClaim;
  const batches = Math.floor(el / INTERVAL_MS);
  // ganha 1 pack por hora
  const pend = Math.min(state.pending + Math.min(batches, rem), rem);
  const ms = el % INTERVAL_MS;
  return {pending:pend, msLeft:INTERVAL_MS - ms, progress: ms / INTERVAL_MS};
}

function renderHome(){
  const {pending, msLeft, progress} = getStatus();
  $('stat-col').textContent    = state.collected.length + '/25';
  $('stat-placed').textContent = Object.keys(state.placed).length + '/25';
  $('stat-packs').textContent  = state.openedPacks.length + '/' + TOTAL_PACKS;
  $('prog').style.width = (progress*100) + '%';

  const pv=$('pvis'), pb=$('pbadge'), cb=$('claim-btn');
  if(pending > 0){
    pv.className='pack-vis ready';
    pb.textContent=pending; pb.style.display='flex';
    $('timer-sec').innerHTML=`<div class="pack-ready-lbl">${pending} PACK${pending>1?'S':''} DISPONÍVE${pending>1?'IS':'L'}!</div>`;
    cb.disabled=false; cb.textContent='RESGATAR PACK';
  } else if(state.openedPacks.length >= TOTAL_PACKS){
    pv.className='pack-vis'; pb.style.display='none';
    $('timer-sec').innerHTML=`<div class="pack-ready-lbl">ÁLBUM COMPLETO! 🏆</div>`;
    cb.disabled=true; cb.textContent='TODOS OS PACKS ABERTOS';
  } else {
    pv.className='pack-vis'; pb.style.display='none';
    $('timer-sec').innerHTML=`<div class="timer-lbl">PRÓXIMO PACK EM</div><div class="timer-disp" id="timer">${fmt(msLeft)}</div>`;
    cb.disabled=true; cb.textContent='AGUARDE O PACK';
  }
}

let timerInt=null;
function startTimer(){
  if(timerInt) clearInterval(timerInt);
  timerInt=setInterval(()=>{
    const {pending,msLeft,progress}=getStatus();
    const t=$('timer'); if(t) t.textContent=fmt(msLeft);
    $('prog').style.width=(progress*100)+'%';
    if(pending>0) renderHome();
  },1000);
}

$('claim-btn').addEventListener('click',()=>{
  const {pending}=getStatus(); if(pending<=0) return;
  // Registra abertura e zera timer
  state.pending   = 0;
  state.lastClaim = Date.now();
  save();
  startOpening(pending);
});
$('go-album').addEventListener('click',()=>{ showScreen('album'); renderAlbum(); });

/* ── OPENING ── */
let opTotal=0, opCurrent=0, opPackIds=[];
function startOpening(count){
  opTotal=count; opCurrent=0;
  showScreen('opening');
  renderOpenPack();
}

function renderOpenPack(){
  opPackIds = randomPackIds(); // sorteia 5 aleatórias
  $('open-prog').innerHTML = Array.from({length:opTotal},(_,i)=>
    `<div class="open-prog-dot" style="background:${i<opCurrent?'#FFDF00':i===opCurrent?'rgba(255,223,0,.45)':'rgba(255,255,255,.1)'}"></div>`
  ).join('');
  $('open-lbl').textContent = `PACK ${opCurrent+1} DE ${opTotal}`;
  const oc=$('open-content'); oc.innerHTML='';
  const env=document.createElement('div'); env.className='pack-env'; env.id='pack-env';
  const im=document.createElement('img'); im.src='image/CAPA DO PACK DAS FIGURINHAS.png'; im.alt='Pack';
  env.appendChild(im);
  const tap=document.createElement('div'); tap.className='pack-env-tap'; tap.textContent='TOQUE PARA ABRIR';
  env.appendChild(tap); oc.appendChild(env);
  env.addEventListener('click', doOpen, {once:true});
}

function doOpen(){
  const env=$('pack-env'); if(env) env.classList.add('opening');
  const ids = opPackIds;
  // Registra pack aberto e figurinhas coletadas
  state.openedPacks.push(state.openedPacks.length);
  ids.forEach(id=>{ if(!state.collected.includes(id)) state.collected.push(id); });
  save();
  setTimeout(()=>renderReveal(ids), 520);
}

function renderReveal(ids){
  const isLast = opCurrent === opTotal-1;
  const oc=$('open-content'); oc.innerHTML='';
  const ttl=document.createElement('div');
  ttl.style.cssText='font-family:Bebas Neue,cursive;font-size:.95rem;letter-spacing:3px;color:#FFDF00';
  ttl.textContent='SUAS FIGURINHAS!'; oc.appendChild(ttl);
  const rev=document.createElement('div'); rev.className='stickers-reveal'; oc.appendChild(rev);
  ids.forEach((id,i)=>{
    const s=sById(id);
    const w=document.createElement('div'); w.className='sr-wrap'; w.style.animationDelay=(i*.12)+'s';
    const card=document.createElement('div'); card.className='sc'; card.id='rsc-'+id+'-'+i;
    card.innerHTML=`<div class="sc-f">✦</div>
      <div class="sc-b" style="border-color:${s.color}">
        <div class="sc-img"><img src="${imgUrl(s)}" alt="${s.name}"/></div>
        <div class="sc-footer" style="background:${s.color}44"><div class="sc-name" style="color:${s.accent}">#${id}</div></div>
      </div>`;
    w.appendChild(card); rev.appendChild(w);
    setTimeout(()=>{ const el=document.getElementById('rsc-'+id+'-'+i); if(el) el.classList.add('flipped'); }, i*170+460);
  });
  const nbtn=document.createElement('button'); nbtn.className='btn btn-gold';
  nbtn.textContent = isLast ? '📖 VER ÁLBUM' : 'PRÓXIMO PACK →';
  nbtn.addEventListener('click',()=>{
    if(isLast){ showScreen('home'); renderHome(); startTimer(); }
    else{ opCurrent++; renderOpenPack(); }
  });
  oc.appendChild(nbtn);
  $('open-prog').innerHTML = Array.from({length:opTotal},(_,i)=>
    `<div class="open-prog-dot" style="background:${i<=opCurrent?'#FFDF00':'rgba(255,255,255,.1)'}"></div>`
  ).join('');
}

/* ── ALBUM ── */
let albPage=0;
const TOTAL_ALB = PAGES.length + 1; // +1 = capa

function renderAlbum(){ renderPage(); renderTray(); buildDots(); $('alb-prog').textContent=Object.keys(state.placed).length+'/25'; }

function buildDots(){
  $('page-dots').innerHTML='';
  for(let i=0;i<TOTAL_ALB;i++){
    const pg=i===0?null:PAGES[i-1];
    const d=document.createElement('div'); d.className='pdot';
    d.style.width  = i===albPage?'20px':'8px';
    d.style.background = i===albPage?(pg?pg.border:'#FFDF00'):'rgba(255,255,255,.15)';
    d.onclick=()=>{ albPage=i; renderAlbum(); };
    $('page-dots').appendChild(d);
  }
}

$('nav-prev').onclick=()=>{ if(albPage>0){ albPage--; renderAlbum(); } };
$('nav-next').onclick=()=>{ if(albPage<TOTAL_ALB-1){ albPage++; renderAlbum(); } };
$('alb-back').onclick=()=>{ showScreen('home'); renderHome(); startTimer(); };

function renderPage(){
  const body=$('alb-body'); body.innerHTML='';
  $('nav-prev').style.opacity = albPage===0?'.3':'1'; $('nav-prev').disabled=albPage===0;
  $('nav-next').style.opacity = albPage===TOTAL_ALB-1?'.3':'1'; $('nav-next').disabled=albPage===TOTAL_ALB-1;

  // CAPA
  if(albPage===0){
    $('alb-title').textContent='CAPA'; $('alb-title').style.color='#FFDF00';
    const pg=document.createElement('div'); pg.className='album-page';
    const placed=Object.keys(state.placed).length;
    pg.innerHTML=`
      <div class="book-spine"></div>
      <div class="alb-cover-inner">
        <div class="alb-cover-img"><img src="image/Capa do Álbum.png" alt="Capa"/></div>
      </div>
      <div style="padding:10px 16px;text-align:center;flex-shrink:0;border-top:1px solid rgba(255,255,255,.05)">
        <div class="cover-progress">${placed}/25 COLADAS</div>
      </div>`;
    body.appendChild(pg); return;
  }

  // PÁGINAS DE FIGURINHA
  const pg=PAGES[albPage-1];
  $('alb-title').textContent=pg.label; $('alb-title').style.color=pg.border;
  const page=document.createElement('div'); page.className='album-page';
  page.style.borderColor=pg.border+'33';
  const placed_c=pg.ids.filter(id=>state.placed[id]).length;
  const hdr=document.createElement('div'); hdr.className='page-hdr';
  hdr.innerHTML=`
    <div class="page-hdr-title" style="color:${pg.border}">${pg.label}</div>
    <div style="font-size:.58rem;color:rgba(255,255,255,.3);font-weight:700">${placed_c}/5 coladas</div>`;
  page.appendChild(hdr);
  const grid=document.createElement('div'); grid.className='sticker-grid';
  pg.ids.forEach(id=>grid.appendChild(makeSlot(id)));
  page.innerHTML = `<div class="book-spine"></div>` + page.innerHTML;
  page.appendChild(grid);
  body.appendChild(page);
}

function openModal(id){
  const s=sById(id);
  const bg=document.createElement('div'); bg.className='sticker-modal-bg';
  const card=document.createElement('div'); card.className='sticker-modal'; card.style.borderColor=s.color;
  card.innerHTML=`
    <div class="sticker-modal-num">#${id}</div>
    <img src="${imgUrl(s)}" alt="${s.name}"/>
    <div class="sticker-modal-close">✕</div>`;
  bg.appendChild(card);
  bg.addEventListener('click',e=>{ if(e.target===bg||e.target.classList.contains('sticker-modal-close')) bg.remove(); });
  document.body.appendChild(bg);
}

function makeSlot(id){
  const s=sById(id), isP=!!state.placed[id];
  const slot=document.createElement('div');
  slot.className='slot'+(isP?' placed':'');
  slot.dataset.slotId=id;
  slot.style.borderColor=isP?s.color:'rgba(255,255,255,.1)';
  if(isP) slot.style.boxShadow=`0 0 10px ${s.color}55`;
  const num=document.createElement('div'); num.className='slot-num';
  num.style.background=isP?s.color:'rgba(0,0,0,.75)'; num.textContent=id; slot.appendChild(num);
  if(isP){
    const im=document.createElement('img'); im.src=imgUrl(s); im.alt=s.name; slot.appendChild(im);
    slot.style.cursor='pointer';
    slot.addEventListener('click',()=>openModal(id));
  } else {
    const e=document.createElement('div'); e.className='slot-empty-txt'; e.textContent=id; slot.appendChild(e);
  }
  return slot;
}

/* ── TRAY ── */
function renderTray(){
  const unplaced=state.collected.filter(id=>!state.placed[id]);
  const tray=$('sticker-tray'), scroll=$('tray-scroll');
  if(unplaced.length===0){ tray.style.display='none'; return; }
  tray.style.display='block'; scroll.innerHTML='';
  unplaced.forEach(id=>{
    const s=sById(id);
    const m=document.createElement('div'); m.className='mini-s'; m.dataset.miniId=id; m.style.borderColor=s.color;
    const im=document.createElement('img'); im.src=imgUrl(s); im.alt=s.name; m.appendChild(im);
    const mn=document.createElement('div'); mn.className='mini-num'; mn.style.background=s.color; mn.textContent=id; m.appendChild(mn);
    setupDrag(m,id,s); scroll.appendChild(m);
  });
}

/* ── DRAG & DROP ── */
const ghost=$('drag-ghost'), ghostImg=$('ghost-img');
let dragging=null;
function setupDrag(el,id,s){
  function startD(cx,cy){
    dragging=id; ghost.style.display='block'; ghost.style.borderColor=s.color;
    ghostImg.src=imgUrl(s); moveG(cx,cy);
  }
  function moveG(cx,cy){ ghost.style.left=(cx-25)+'px'; ghost.style.top=(cy-35)+'px'; }
  function endD(cx,cy){
    ghost.style.display='none'; if(dragging===null) return;
    document.querySelectorAll('[data-slot-id]').forEach(slot=>{
      const r=slot.getBoundingClientRect();
      if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom){
        const sid=parseInt(slot.dataset.slotId);
        if(sid===dragging&&!state.placed[sid]){
          state.placed[sid]=true; save(); renderAlbum();
        }
      }
    }); dragging=null;
  }
  el.addEventListener('mousedown',e=>{ e.preventDefault(); startD(e.clientX,e.clientY); });
  el.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.touches[0]; startD(t.clientX,t.clientY); },{passive:false});
  document.addEventListener('mousemove',e=>{ if(dragging===id) moveG(e.clientX,e.clientY); });
  document.addEventListener('touchmove',e=>{ if(dragging===id){ const t=e.touches[0]; moveG(t.clientX,t.clientY); } },{passive:true});
  document.addEventListener('mouseup',e=>{ if(dragging===id) endD(e.clientX,e.clientY); });
  document.addEventListener('touchend',e=>{ if(dragging===id){ const t=e.changedTouches[0]; endD(t.clientX,t.clientY); } });
}

function init(){ load(); renderHome(); startTimer(); }
init();
})();
</script>
